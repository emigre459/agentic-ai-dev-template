[project]
# Placeholder name/description — replaced by scripts/init_template.py at `make init`.
# Kept as a PEP 508-valid identifier so `uv sync` succeeds pre-init; the unique
# token below (and `{{DESCRIPTION}}` literal) are the substitution targets.
name = "template-placeholder-project-name"
version = "0.1.0"
description = "{{DESCRIPTION}}"
readme = "README.md"
requires-python = ">=3.13.5,<3.14"
dependencies = [
    "pydantic>=2.12",
    "python-dotenv>=1.2",
]

[build-system]
# One uv/uv_build minor line, matching the uv CI installs (setup-uv: latest).
# uv bumps the MINOR version for breaking changes, and build-system.requires is
# not locked by uv.lock, so the range spans a single minor. Move both bounds when
# Dependabot opens a PR for the next line (uv-build minor exception in
# .github/dependabot.yml) or CI warns the range "does not contain the current uv
# version", whichever comes first.
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Sample package lives at `src/example_app/`; init swaps both the project name
# and this module-name to the user's chosen package at `make init`.
module-name = "example_app"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "black>=26.10.1",
    "mypy>=1.13.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "pytest-xdist>=3.6.1",
    "ruff>=0.15.20",
]
# Opt-in, not in default-groups: teaching notebooks (the write-teaching-notebook
# skill) run with `uv run --group notebook ...`.
notebook = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "nbclient>=0.11.0",
    "plotly>=7.1.0",
    "rich>=15.0.0",
]

[tool.black]
line-length = 88

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
ignore_missing_imports = true
show_error_codes = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
extend-select = ["E501", "W", "D", "BLE"]
extend-ignore = ["D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "D100", "D101", "D102", "D103", "D104"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-n auto -m 'not e2e and not integration' --allow-hosts=127.0.0.0/8,::1,localhost --allow-unix-socket"
# A blocked connect in a background thread surfaces only as pytest's thread-exception
# warning; promote it to an error when it names NetworkBlocked (tests/_network_block.py).
filterwarnings = [
    "error:(?s).*NetworkBlocked:pytest.PytestUnhandledThreadExceptionWarning",
]
markers = [
    "integration: marks tests that call live external APIs. Opt-in lane: keeps real network access, while default-lane tests are blocked from non-loopback hosts",
    "e2e: marks tests that exercise the full pipeline against live services",
]

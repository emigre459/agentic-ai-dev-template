# Security updates always; version updates for MAJOR versions only.
#
# Every entry (but the template's own skills CLI pin, below) has an `allow`
# rule on `version-update:semver-major`, so routine minor/patch bumps no longer
# open weekly PRs, while each major lands on its own PR where someone will
# notice it (a major left unnoticed is how a project ends
# up a whole SDK version behind when the vendor removes APIs). `update-types`
# limits version updates only: Dependabot security updates are still created
# for every update type, with each entry's labels and commit prefix.
# The uv rules add `dependency-type: "direct"`: a major of an indirect
# (lockfile-only) dependency is its parent package's call, and taking it alone
# makes this repo the parent's compatibility tester; it arrives with a
# deliberate `uv lock --upgrade` instead. Security updates still reach indirect
# dependencies: Dependabot ignores `dependency-type` for them.
# Take a minor/patch change outside a security fix as a deliberate upgrade in a
# normal PR (see the upgrade-deps skill).
# >>> STACK:template
#
# Guarded by tests/template/test_dependabot_policy.py (removed with the rest of
# the template machinery at init).
# <<< STACK:template
version: 2
updates:
# >>> STACK:python
  # uv-managed stack (pyproject.toml + uv.lock); "uv" updates the lockfile
  # incl. transitive deps, which "pip" cannot.
  - package-ecosystem: "uv"
    directory: "/stacks/python"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "deps"
    allow:
      - dependency-name: "*"
        dependency-type: "direct"
        update-types: ["version-update:semver-major"]
      # uv ships breaking changes in 0.x MINOR releases, and the build-system
      # pin in pyproject.toml spans a single minor line, so a uv-build minor is
      # effectively a major here.
      - dependency-name: "uv-build"
        dependency-type: "direct"
        update-types: ["version-update:semver-minor"]
# <<< STACK:python
# >>> STACK:react
  # bun-managed stack (bun.lock); "npm" cannot read bun.lock.
  - package-ecosystem: "bun"
    directory: "/stacks/react"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "javascript"]
    commit-message:
      prefix: "deps"
    allow:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # Keep peer-coupled packages together so a major on one doesn't land as a
      # separate, mutually-incompatible PR. (See #4: vite 8 needs plugin-react 6;
      # @vitest/coverage-istanbul 4 needs vitest 4 — those must move as a set.)
      vite:
        patterns: ["vite", "@vitejs/*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
# <<< STACK:react
# >>> STACK:template
  # Repo-root uv project — the TEMPLATE's own tooling (its pyproject.toml +
  # uv.lock). Post-init this manifest is gone (react) or replaced by the
  # promoted stack's entry rewritten to "/" (python), so init must strip this
  # block or seeded repos get a dangling/duplicate uv entry at "/".
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "deps"
    allow:
      - dependency-name: "*"
        dependency-type: "direct"
        update-types: ["version-update:semver-major"]
  # The skills CLI version every skills-* action runs (npx -y skills@<pin>). A
  # bump must come with golden.json regenerated from the new CLI (see
  # tests/template/test_skills_lock.py); the hash tests fail until it does.
  # The one exception to majors-only: no `allow` rule, so every CLI release is
  # proposed, one PR at a time.
  - package-ecosystem: "npm"
    directory: "/.github/actions/skills-cli"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    labels: ["dependencies", "javascript"]
    commit-message:
      prefix: "deps"
# <<< STACK:template
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci"
    allow:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

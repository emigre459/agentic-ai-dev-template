name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs from the Actions tab (or `gh workflow run ci.yml --ref <branch>`).
  workflow_dispatch:
  # Merge-queue commits: the required jobs must report on the
  # gh-readonly-queue/main/* commit or a merge queue never merges it.
  merge_group:
    types: [checks_requested]

# >>> STACK:template
# Each stack runs lint / tests / security as separate parallel jobs. Job ids
# carry a stack prefix because both stacks coexist pre-init (duplicate job ids
# are invalid YAML); `make init` strips the kept stack's prefix so seeded repos
# get plain `lint` / `tests` / `security` jobs matching the
# required_status_checks contexts it writes into ruleset.json.
# <<< STACK:template
jobs:
  # Stack-independent: outside every STACK marker so it survives `make init`.
  # `make init` rewrites the local action path to the remote action at the lock's
  # ref. Full history + tags: template mode verifies a lock entry's ref locally.
  skills-drift:
    name: skills drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: ./.github/actions/skills-drift

# >>> STACK:python
  python-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stacks/python
    steps:
      - uses: actions/checkout@v7
      - name: Read Python version
        id: pyver
        run: echo "value=$(cat .python-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.pyver.outputs.value }}
      - uses: astral-sh/setup-uv@v7
      - run: make deps
      - run: make lint

  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stacks/python
    steps:
      - uses: actions/checkout@v7
      - name: Read Python version
        id: pyver
        run: echo "value=$(cat .python-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.pyver.outputs.value }}
      - uses: astral-sh/setup-uv@v7
      - run: make deps
      - run: make coverage

  python-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stacks/python
    steps:
      - uses: actions/checkout@v7
      - name: Read Python version
        id: pyver
        run: echo "value=$(cat .python-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.pyver.outputs.value }}
      - uses: astral-sh/setup-uv@v7
      - run: make deps
      - run: make security
# <<< STACK:python
# >>> STACK:react
  react-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stacks/react
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: make deps
      - run: make lint

  react-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stacks/react
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: make deps
      - run: make coverage

  react-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stacks/react
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: make deps
      - run: make security
# <<< STACK:react
# >>> STACK:template
  # Not a deployable stack — this job checks the TEMPLATE's own machinery (the
  # init/apply scripts + tests/template that build new repos). It exists only
  # pre-init; `make init` strips this whole marker block from the spawned repo.
  template:
    name: template machinery (lint + tests)
    runs-on: ubuntu-latest
    steps:
      # Full history + tags: test_shipped_lock_is_current verifies a pinned
      # lock's release tag locally, as the `skills drift` job does.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Read Python version
        id: pyver
        run: echo "value=$(cat .python-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.pyver.outputs.value }}
      - uses: astral-sh/setup-uv@v7
      - run: make tooling_deps
      - run: make machinery_lint
      - run: make machinery_tests

  # Template-only: runs the skills CLI's real install of every published skill
  # (what the nightly update does), so an uninstallable release can't merge.
  skills-installable:
    name: skills installable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Read Python version
        id: pyver
        run: echo "value=$(cat .python-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.pyver.outputs.value }}
      - run: python3 scripts/check_skills_installable.py
# <<< STACK:template

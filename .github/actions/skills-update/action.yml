name: Skills update PR
description: >-
  Update every agent skill installed with the skills CLI and open (or refresh) one
  "Update agent skills" PR: tag-pinned skills move to their source's newest stable
  release, branch-tracking skills to the branch tip. The branch is rebuilt on the
  latest base each run; with no drift an open update PR is closed. The caller checks
  the repo out (full history) and sets up Node 22; the PR never merges itself.
inputs:
  token:
    description: >-
      Token for gh AND for git pushes (GITHUB_TOKEN, a GitHub App token or a PAT).
      The action replaces the checkout's persisted git credentials with it, so the
      push is made as this token's identity (a GitHub App or PAT push triggers the
      PR's pull_request CI; a GITHUB_TOKEN push does not). It needs contents: write
      and pull-requests: write, plus actions: write when dispatch-ci is "true".
    required: true
  dispatch-ci:
    description: >-
      "true" to dispatch the CI workflow on the update branch after a push or a new
      PR. Needed with GITHUB_TOKEN, whose pushes do not trigger pull_request CI
      normally; leave "false" with a GitHub App token or PAT.
    required: false
    default: "false"
  branch:
    description: Branch the update is committed on, rebuilt from base every run.
    required: false
    default: skills-update
  base:
    description: Branch the update PR targets.
    required: false
    default: main
  ci-workflow:
    description: Workflow file dispatched on the branch when dispatch-ci is "true".
    required: false
    default: ci.yml
  labels:
    description: Space-separated labels added to the PR (best-effort).
    required: false
    default: dependencies
runs:
  using: composite
  steps:
    # Copy both scripts OUTSIDE the work tree first: the checkout below replaces the
    # work tree with the base branch's content, and they must not vanish with it
    # (this also keeps the scripts and the YAML that calls them on the same ref).
    - name: Stage the scripts outside the work tree
      shell: bash
      run: |
        cp "$GITHUB_ACTION_PATH/update-pr.sh" "$RUNNER_TEMP/skills_update_pr.sh"
        cp "$GITHUB_ACTION_PATH/bump-pins.mjs" "$RUNNER_TEMP/skills_bump_pins.mjs"

    - name: Rebuild the update branch on the latest base
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
        BASE: ${{ inputs.base }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git fetch origin "$BASE"
        git fetch origin "$BRANCH" || echo "No existing $BRANCH on origin"
        git checkout -B "$BRANCH" "origin/$BASE"

    # actions/checkout persists GITHUB_TOKEN as an http extraheader; left alone, every
    # push would go out as GITHUB_TOKEN whatever `token` is. Replace it with `token`.
    - name: Push with the token input
      shell: bash
      env:
        PUSH_TOKEN: ${{ inputs.token }}
      run: |
        server="${GITHUB_SERVER_URL:-https://github.com}"
        key="http.${server}/.extraheader"
        encoded="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
        echo "::add-mask::$PUSH_TOKEN"
        echo "::add-mask::$encoded"
        git config --local --unset-all "$key" || true
        # An empty value resets any header the checkout stored in an included config.
        git config --local --add "$key" ""
        git config --local --add "$key" "AUTHORIZATION: basic $encoded"

    - name: Bump tag-pinned skills to their newest releases
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GITHUB_TOKEN: ${{ inputs.token }}
        DISABLE_TELEMETRY: "1"
      run: |
        summary="$(node "$RUNNER_TEMP/skills_bump_pins.mjs" --root .)"
        echo "SKILLS_UPDATE_SUMMARY=$summary" >> "$GITHUB_ENV"

    - name: Update branch-tracking skills
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        DISABLE_TELEMETRY: "1"
      run: npx -y skills@latest update -p -y

    - name: Open or refresh the update PR
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_CMD: gh
        BRANCH: ${{ inputs.branch }}
        BASE: ${{ inputs.base }}
        DISPATCH_CI: ${{ inputs.dispatch-ci }}
        CI_WORKFLOW: ${{ inputs.ci-workflow }}
        PR_LABELS: ${{ inputs.labels }}
      run: bash "$RUNNER_TEMP/skills_update_pr.sh"

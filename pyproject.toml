[project]
name = "agentic-ai-dev-template-tooling"
version = "0.0.0"
description = "Template-only tooling: tests for the init/apply machinery. Removed or replaced at `make init`."
requires-python = ">=3.13.5,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "black>=26.3.0",
    "ruff>=0.15.20",
    "mypy>=1.13.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.6.1",
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
extend-select = ["E501", "W", "D"]
extend-ignore = ["D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "D100", "D101", "D102", "D103", "D104"]
"scripts/**" = ["E402", "E501", "D100"]

[tool.mypy]
python_version = "3.13"
# Cross-module type-checking best practice (learned in gridium-agent, issue #1430).
# This template type-checks scripts/ + tests/ only. When you add a first-party
# package under src/<name>/, you MUST also (1) uncomment "src" in `files` below
# and (2) keep mypy_path set (add explicit_package_bases = true too if tests/
# lacks __init__.py). Otherwise mypy names your modules `src.<name>.*`,
# first-party `from <name> import X` imports fall through to the untyped installed
# distribution, the global `ignore_missing_imports` silences them, and every
# cross-module import resolves to `Any` while mypy still prints "Success" -- i.e.
# it silently checks no module boundary. As the project matures, prefer scoping
# `ignore_missing_imports` per-module (via [[tool.mypy.overrides]]) over the
# global flag, and add a `src/<name>/py.typed` marker LAST -- once the tree is
# type-clean -- as the downstream "this package is type-safe" guarantee.
files = [
    "scripts",
    "tests",
    # "src",  # uncomment when you add your package under src/<name>/
]
mypy_path = ["src"]
ignore_missing_imports = true
show_error_codes = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests/template"]
addopts = "-n auto"
pythonpath = ["."]
